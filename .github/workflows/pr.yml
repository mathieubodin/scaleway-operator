name: PR

on:
  pull_request:
    branches:
      - main

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # Job 1: Lint — format + clippy + markdownlint
  # Bloquant : unit-tests ne démarre pas si lint échoue.
  # ────────────────────────────────────────────────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-pr-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-pr-

      - name: Set up Helm
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2  # v5.0.0

      - name: Install markdownlint-cli2
        run: npm install -g markdownlint-cli2

      - name: Lint and format
        run: make check

  # ────────────────────────────────────────────────────────────────────────────
  # Job 2: Unit tests + Codecov upload (flag: unit)
  # Déclenché uniquement si lint passe (fail fast).
  # Patch coverage < 80 % → status check Codecov bloque le merge.
  # ────────────────────────────────────────────────────────────────────────────
  unit-tests:
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-pr-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-pr-

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@7a79fe8c3a13344501c80d99cae481c1c9085912  # v2
        with:
          tool: cargo-llvm-cov

      - name: Run unit tests with coverage
        run: make coverage-lcov

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac  # v5.5.5
        with:
          files: target/llvm-cov/lcov.info
          flags: unit
          token: ${{ secrets.CODECOV_TOKEN }}
