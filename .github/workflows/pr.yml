name: PR

on:
  pull_request:
    branches:
      - main

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # Job 1: Lint — format + clippy + markdownlint
  # Bloquant : unit-tests ne démarre pas si lint échoue.
  # ────────────────────────────────────────────────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-pr-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-pr-

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5.0.1

      - name: Install markdownlint-cli2
        run: npm install -g markdownlint-cli2

      - name: Lint and format
        run: make check

  # ────────────────────────────────────────────────────────────────────────────
  # Job 2: Unit tests + Codecov upload (flag: unit)
  # Déclenché uniquement si lint passe (fail fast).
  # Patch coverage < 80 % → status check Codecov bloque le merge.
  # ────────────────────────────────────────────────────────────────────────────
  unit-tests:
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-cov-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-cov-

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad  # v2
        with:
          tool: cargo-llvm-cov

      - name: Run unit tests with coverage
        run: make coverage-lcov

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac  # v5.5.5
        # Secrets unavailable on fork PRs — upload is best-effort, never blocks the job
        if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        with:
          files: target/llvm-cov/lcov.info
          flags: unit
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
