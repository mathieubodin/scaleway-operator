name: Release

# Publication seule. Les tags et releases sont créés depuis le shell par
# `make release-publish` avec le token `gh` local : une release créée avec ce token
# déclenche ce workflow, contrairement au token standard des Actions.
# `make release-publish` exige des tests d'intégration verts avant de créer la release.
# Le préfixe du tag choisit l'action : image pour le binaire, push OCI pour un chart.
on:
  release:
    types: [published]

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # Job 1: Build multi-arch + push GHCR + cosign signing
  # Tags `scaleway-operator-v*` (binaire).
  # ────────────────────────────────────────────────────────────────────────────
  image:
    if: ${{ startsWith(github.event.release.tag_name, 'scaleway-operator-v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Version sans le préfixe de composant : docker/metadata-action attend un semver nu.
      - name: Extract version from tag
        id: version
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${TAG_NAME#scaleway-operator-v}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "ERROR: invalid version in tag: $TAG_NAME" >&2; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Buildx requis pour --platform multi-arch
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      # Login GHCR via GITHUB_TOKEN (OIDC natif, zéro secret à gérer)
      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee  # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Génération des tags OCI : semver (vX.Y.Z, vX.Y, vX), latest, sha court
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9  # v6.1.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=auto
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.version }}
            type=semver,pattern={{major}},value=${{ steps.version.outputs.version }}
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.title=scaleway-operator
            org.opencontainers.image.description=Kubernetes operator for Scaleway resources
            org.opencontainers.image.vendor=Scaleway

      # Build multi-arch + push GHCR
      # cargo-chef + cargo-zigbuild dans le Dockerfile :
      #   linux/amd64 → x86_64-unknown-linux-musl (natif sur runner CI)
      #   linux/arm64 → aarch64-unknown-linux-musl (cross-compilé, pas de QEMU)
      - name: Build and push
        id: build-and-push
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf  # v7.2.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags:    ${{ steps.meta.outputs.tags }}
          labels:  ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      # Cosign keyless signing (Fulcio/Rekor, OIDC GHA, zéro gestion de clé)
      # La signature est attachée au digest immuable, pas au tag mutable
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          cosign-release: v2.5.2

      - name: Sign image
        env:
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
          TAGS:   ${{ steps.meta.outputs.tags }}
        run: |
          images=""
          while IFS= read -r tag; do
            images+="${tag}@${DIGEST} "
          done <<< "${TAGS}"
          cosign sign --yes ${images}

      # Attestation de provenance SLSA Level 2 (GitHub-natif)
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name:   ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build-and-push.outputs.digest }}
          push-to-registry: true

  # ────────────────────────────────────────────────────────────────────────────
  # Job 2: Publication d'un chart Helm en OCI sur GHCR
  # Tags `scaleway-operator-chart-v*` et `scaleway-operator-crds-v*`.
  # ────────────────────────────────────────────────────────────────────────────
  chart:
    if: ${{ startsWith(github.event.release.tag_name, 'scaleway-operator-chart-v') || startsWith(github.event.release.tag_name, 'scaleway-operator-crds-v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5.0.1

      - name: Log in to GHCR Helm registry
        env:
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GH_TOKEN" | helm registry login ghcr.io --username "$GH_ACTOR" --password-stdin

      - name: Package and push chart
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          case "$TAG_NAME" in
            scaleway-operator-chart-v*) CHART=scaleway-operator;      VERSION="${TAG_NAME#scaleway-operator-chart-v}" ;;
            scaleway-operator-crds-v*)  CHART=scaleway-operator-crds; VERSION="${TAG_NAME#scaleway-operator-crds-v}" ;;
          esac
          CHART_VERSION=$(grep '^version:' "charts/${CHART}/Chart.yaml" | awk '{print $2}')
          if [ "$CHART_VERSION" != "$VERSION" ]; then
            echo "ERROR: tag $TAG_NAME does not match charts/${CHART}/Chart.yaml version '$CHART_VERSION'" >&2
            exit 1
          fi
          mkdir -p target/charts
          helm package "charts/${CHART}" --destination target/charts/
          for attempt in 1 2 3; do
            helm push "target/charts/${CHART}-${VERSION}.tgz" "oci://ghcr.io/${OWNER}/charts" && exit 0
            [ "$attempt" -lt 3 ] && echo "Push attempt $attempt failed, retrying…" && sleep 10
          done
          exit 1
