name: Integration

# Tests d'intégration sur chaque push main. `make release-publish` exige leur succès
# sur le commit de merge de la PR de release avant de créer tags et releases.
on:
  push:
    branches:
      - main

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # kind est préinstallé sur ubuntu-latest (appartient à root — ne pas réinstaller
      # par curl/chmod sans sudo). Le script de test ne pinne aucune node image.
      - name: Show kind version
        run: kind version

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-integration-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-integration-

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5.0.1

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad  # v2
        with:
          tool: cargo-llvm-cov

      - name: Run coverage (unit + integration)
        run: make coverage-kind-lcov

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac  # v5.5.5
        with:
          files: target/llvm-cov/lcov.info
          flags: integration
          token: ${{ secrets.CODECOV_TOKEN }}
        continue-on-error: true
